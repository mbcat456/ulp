[package]
name = "ulp"
version = "1.58.0"
edition = "2024"
rust-version = "1.88"
description = "A lossless, searchable binary format and toolchain for url:username:password combo lists."
license = "MIT"
repository = "https://github.com/mbcat456/ulp"
homepage = "https://github.com/mbcat456/ulp"
readme = "README.md"
keywords = ["credentials", "index", "compression", "security", "cli"]
categories = ["command-line-utilities", "database-implementations"]
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
